annotation_label: AI_ASSISTED_AUDITED   # NOT human-verified ground truth
schema_version: "1.0.0"
reference_clock: back_stream_pts        # Phase 11/12C convention; front t_ref = front pts + global_offset_sec

models:
  vehicle_person:
    weights: yolov8n.pt
    sha256: f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36
    classes: {0: person, 3: motorcycle}   # COCO subset used
    conf_threshold_low: 0.18              # ByteTrack stage-2 recovery (configs/tracking_config.yaml)
    conf_threshold_high: 0.45             # ByteTrack stage-1 / track init
    iou_nms_threshold: 0.45
  helmet:
    weights: results/phase9_multiseed/exp_combined/seed_42/weights/best.pt
    sha256: 0929a882667e0f7e2b631071ab218a2415cc1b816cdede7fb6812543d840b0e5
    classes: {0: no_helmet, 1: helmet}    # cranial (head) detections only
